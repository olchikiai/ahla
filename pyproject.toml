# olchiki-ocr build metadata.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olchiki-ocr"
# Package version, independent of the model version (recorded in provenance.json).
version = "0.1.0"
description = "Ol Chiki (Santali) OCR: recognize Ol Chiki text from word or line images with an ONNX Runtime core (torch-free), plus optional GPU, OpenCV, training, and export tiers."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
# Code is MIT; the model weights/ONNX are Apache-2.0 (see LICENSE-MODEL, NOTICE).
license = { text = "MIT" }
authors = [{ name = "olchiki-ocr maintainers" }, { name = "olchikiai" }]
keywords = ["ocr", "ol-chiki", "santali", "onnx", "ctc", "text-recognition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Other",
]

# Core deps (torch-free): ONNX Runtime is the inference engine.
dependencies = [
    "onnxruntime>=1.16",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.16",
]
cv = [
    "opencv-python>=4.8",
]
# DTRB is not a pip dep; it's a pinned external git clone the trainer shells out to.
train = [
    "torch>=2.0",
    "lmdb>=1.4",
    "fonttools>=4.40",
    "numpy>=1.24",
]
export = [
    "torch>=2.0",
    "onnx>=1.15",
]

[project.scripts]
olchiki-ocr = "olchiki_ocr.cli:main"

[project.urls]
Homepage = "https://github.com/olchikiai/ahla"
Repository = "https://github.com/olchikiai/ahla"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE", "LICENSE-MODEL", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["olchiki_ocr*"]

# Ship the default Ol Chiki word list; the model weights download at runtime.
[tool.setuptools.package-data]
olchiki_ocr = ["data/**"]
