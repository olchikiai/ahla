name: Release

# Build the wheel + sdist and attach them to a GitHub Release whenever a
# version tag (v*) is pushed. PyPI publishing is included below but COMMENTED
# OUT — enable it later once you set up PyPI Trusted Publishing for this repo.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/update the GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build wheel + sdist
        run: python -m build .

      - name: Validate artifacts
        run: python -m twine check dist/*

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # The release is created for the pushed tag; body/name default to the tag.
          generate_release_notes: true

